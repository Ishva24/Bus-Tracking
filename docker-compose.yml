version: '3.9'

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bustrack
      MYSQL_USER: bustrack
      MYSQL_PASSWORD: bustrack_dev_password
      MYSQL_ROOT_PASSWORD: bustrack_root_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mysql_data:
